<!doctype html>
<html lang="fr" dir="ltr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>École Al-Carmelia · Espace Parents & Élèves</title>
<link rel="manifest" href="manifest.json">
<meta name="theme-color" content="#7b1238">
<link rel="apple-touch-icon" href="icon-192.png">
<style>
:root{--burg:#7b1238;--navy:#12365f;--gold:#d7ae45;--cream:#faf7ef;--ink:#172235;--muted:#718096;--line:#e6e9ef;--white:#fff;--danger:#b42318;--green:#16825d}
*{box-sizing:border-box}
body{margin:0;font-family:Inter,system-ui,-apple-system,sans-serif;background:#f4f6f9;color:var(--ink)}
button,input,select,textarea{font:inherit}

.login-modal{position:fixed;inset:0;background:rgba(18,54,95,0.95);display:flex;align-items:center;justify-content:center;z-index:999;padding:15px}
.login-box{background:#fff;padding:35px 25px;border-radius:18px;width:min(400px,100%);text-align:center}
.login-box img{width:75px;height:75px;border-radius:12px;margin-bottom:12px;object-fit:cover}
.login-box h2{margin:0 0 8px;color:var(--navy)}
.login-box input{width:100%;padding:12px;border:1px solid #d8dde6;border-radius:10px;margin-bottom:12px;outline:none}

.pw-wrap{position:relative;display:flex;align-items:center;margin-bottom:12px}
.pw-wrap input{margin-bottom:0!important;padding-right:40px!important}
.pw-toggle{position:absolute;right:12px;background:none;border:none;cursor:pointer;font-size:18px;color:var(--muted)}

.container{max-width:900px;margin:0 auto;padding:20px 15px}
.header{background:#fff;border-radius:16px;padding:16px 20px;border:1px solid var(--line);display:flex;justify-content:space-between;align-items:center;margin-bottom:20px}
.header-brand{display:flex;align-items:center;gap:12px}
.header-brand img{width:48px;height:48px;border-radius:10px;object-fit:cover}

.btn{border:0;border-radius:10px;padding:10px 16px;cursor:pointer;font-weight:650;display:inline-flex;align-items:center;gap:6px;font-size:14px}
.btn-block{width:100%}
.primary{background:var(--burg);color:#fff}
.secondary{background:#eef2f7;color:var(--navy)}
.danger{background:#fff0ef;color:var(--danger)}
.gold{background:var(--gold);color:var(--ink)}

.tabs{display:flex;gap:8px;margin-bottom:20px;overflow-x:auto}
.tab-btn{background:#fff;border:1px solid var(--line);padding:10px 18px;border-radius:10px;cursor:pointer;font-weight:600;color:var(--muted);white-space:nowrap}
.tab-btn.active{background:var(--burg);color:#fff;border-color:var(--burg)}

.card{background:#fff;border-radius:16px;border:1px solid var(--line);padding:20px;margin-bottom:15px}
.table{width:100%;border-collapse:collapse}
.table th,.table td{padding:12px 10px;border-bottom:1px solid var(--line);text-align:left}
.table th{font-size:12px;color:var(--muted)}
.badge{display:inline-block;padding:4px 9px;border-radius:999px;font-size:12px;font-weight:700;background:#eef3fa;color:var(--navy)}
.badge.red{background:#fde8e8;color:var(--danger)}
</style>
<script src="https://www.gstatic.com/firebasejs/9.23.0/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/9.23.0/firebase-firestore-compat.js"></script>
</head>
<body>

<div id="loginModal" class="login-modal">
  <div class="login-box">
    <img src="icon-192.png" alt="Logo">
    <h2>Portail Parents & Élèves</h2>
    <p style="color:var(--muted);font-size:13px;margin-bottom:20px">École Al-Carmelia</p>
    <input type="text" id="studentIdInput" placeholder="ID Élève (Ex: ST-101)">
    <div class="pw-wrap">
      <input type="password" id="studentPinInput" placeholder="Code PIN">
      <button class="pw-toggle" type="button" onclick="togglePass('studentPinInput', this)">👁️</button>
    </div>
    <button class="btn primary btn-block" onclick="loginStudent()">Accéder au Portail</button>
  </div>
</div>

<div id="parentContent" class="container" style="display:none">
  <header class="header">
    <div class="header-brand">
      <img src="icon-192.png" alt="Logo">
      <div>
        <h1 id="p_studentName" style="margin:0;font-size:18px;color:var(--navy)">Nom Élève</h1>
        <p id="p_studentClass" style="margin:2px 0 0;color:var(--muted);font-size:13px">Classe</p>
      </div>
    </div>
    <div style="display:flex;gap:8px">
      <button class="btn gold" style="padding:8px 12px;font-size:12px" onclick="enableNotifications()">🔔 Activer Notifs</button>
      <button class="btn danger" style="padding:8px 12px;font-size:12px" onclick="logoutStudent()">Déconnexion</button>
    </div>
  </header>

  <nav class="tabs">
    <button class="tab-btn active" onclick="switchTab('p_agenda', this)">📖 Agenda / Homework</button>
    <button class="tab-btn" onclick="switchTab('p_grades', this)">📊 Relevé des Notes</button>
    <button class="tab-btn" onclick="switchTab('p_attendance', this)">📅 Présences & Absences</button>
    <button class="tab-btn" onclick="switchTab('p_announcements', this)">📢 Annonces École</button>
  </nav>

  <div id="p_agenda" class="tab-content">
    <div class="card">
      <h3 style="margin-top:0">Devoirs et Agenda de la Classe</h3>
      <div id="p_agendaList"></div>
    </div>
  </div>

  <div id="p_grades" class="tab-content" style="display:none">
    <div class="card">
      <h3 style="margin-top:0">Bulletin / Notes Obtenues</h3>
      <div style="overflow-x:auto">
        <table class="table">
          <thead><tr><th>Matière</th><th>Note</th><th>Appréciation / Remarque</th></tr></thead>
          <tbody id="p_gradesBody"></tbody>
        </table>
      </div>
    </div>
  </div>

  <div id="p_attendance" class="tab-content" style="display:none">
    <div class="card">
      <h3 style="margin-top:0">Suivi des Absences et Retards</h3>
      <div style="overflow-x:auto">
        <table class="table">
          <thead><tr><th>Date</th><th>Statut</th></tr></thead>
          <tbody id="p_attendanceBody"></tbody>
        </table>
      </div>
    </div>
  </div>

  <div id="p_announcements" class="tab-content" style="display:none">
    <div class="card">
      <h3 style="margin-top:0">Communiqués Officiels de la Direction</h3>
      <div id="p_announcementsList"></div>
    </div>
  </div>
</div>

<script>
if ('serviceWorker' in navigator) {
  navigator.serviceWorker.register('sw.js');
}

const firebaseConfig = {
  apiKey: "AIzaSyDJRfis99yy8m9Z7pIHkw3U2i0jUqLXBec",
  authDomain: "carmelia-school.firebaseapp.com",
  projectId: "carmelia-school",
  storageBucket: "carmelia-school.firebasestorage.app",
  messagingSenderId: "710304409299",
  appId: "1:710304409299:web:44c4c109d432a6e3ba1626"
};
firebase.initializeApp(firebaseConfig);
const firestore = firebase.firestore();

let db = { students:[], agenda:[], grades:{}, attendance:{}, announcements:[] };
let currentStudent = null;

firestore.collection("school_data").doc("main").onSnapshot((doc) => {
  if (doc.exists) {
    db = doc.data();
    if(currentStudent) renderParentPortal();
  }
});

function togglePass(id, btn){
  const inp = document.getElementById(id);
  inp.type = inp.type==='password'?'text':'password';
  btn.textContent = inp.type==='password'?'👁️':'🙈';
}

function esc(s){return String(s??'').replace(/[&<>"']/g,m=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[m]))}

function loginStudent() {
  const sid = studentIdInput.value.trim().toUpperCase();
  const pin = studentPinInput.value.trim();
  const st = (db.students || []).find(x => x.id.toUpperCase() === sid && (x.pin || '1234') === pin);

  if (st) {
    currentStudent = st;
    sessionStorage.setItem('parent_st_id', st.id);
    document.getElementById('loginModal').style.display = 'none';
    document.getElementById('parentContent').style.display = 'block';
    renderParentPortal();
  } else {
    alert("ID ou PIN incorrect.");
  }
}

function logoutStudent() { sessionStorage.removeItem('parent_st_id'); location.reload(); }

function switchTab(tabId, btn) {
  document.querySelectorAll('.tab-content').forEach(c => c.style.display = 'none');
  document.querySelectorAll('.tab-btn').forEach(b => b.classList.remove('active'));
  document.getElementById(tabId).style.display = 'block';
  btn.classList.add('active');
}

function renderParentPortal() {
  p_studentName.textContent = currentStudent.name;
  p_studentClass.textContent = "Classe: " + currentStudent.class;

  const list = (db.agenda || []).filter(a => a.class === currentStudent.class);
  p_agendaList.innerHTML = list.map(a => `
    <div style="border-bottom:1px solid var(--line);padding:12px 0">
      <div style="display:flex;justify-content:space-between">
        <strong>${esc(a.title)}</strong>
        <span class="badge">${esc(a.subject)}</span>
      </div>
      <div style="font-size:12px;color:var(--muted);margin:4px 0">Pour le: <b>${esc(a.date)}</b> · Prof: ${esc(a.teacher)}</div>
      <p style="margin:6px 0 0;font-size:14px;color:var(--ink)">${esc(a.body)}</p>
    </div>
  `).join('') || '<div style="color:var(--muted);padding:15px 0">Aucun devoir à venir pour cette classe.</div>';

  const gList = Object.entries(db.grades || {})
    .filter(([k]) => k.startsWith(currentStudent.id + '_'))
    .map(([k, v]) => v);

  p_gradesBody.innerHTML = gList.map(g => `
    <tr>
      <td><strong>${esc(g.subject)}</strong></td>
      <td><span class="badge">${esc(g.note)} / 20</span></td>
      <td>${esc(g.rem || '-')}</td>
    </tr>
  `).join('') || '<tr><td colspan="3" style="text-align:center;color:var(--muted)">Aucune note encore saisie.</td></tr>';

  const attList = Object.entries(db.attendance || {})
    .filter(([k]) => k.endsWith('_' + currentStudent.id))
    .map(([k, v]) => ({ date: k.split('_')[0], status: v }));

  p_attendanceBody.innerHTML = attList.map(a => `
    <tr>
      <td>${esc(a.date)}</td>
      <td><span class="badge ${a.status==='Absent'?'red':''}">${esc(a.status)}</span></td>
    </tr>
  `).join('') || '<tr><td colspan="2" style="text-align:center;color:var(--muted)">Aucune absence ou retard enregistré.</td></tr>';

  p_announcementsList.innerHTML = (db.announcements || []).map(a => `
    <div style="border-bottom:1px solid var(--line);padding:12px 0">
      <strong>${esc(a.title)}</strong>
      <div style="font-size:12px;color:var(--muted);margin-top:2px">${esc(a.date)} · Par: ${esc(a.author || 'Direction')}</div>
      <p style="margin:6px 0 0">${esc(a.body)}</p>
    </div>
  `).join('') || '<div style="color:var(--muted);padding:15px 0">Aucune annonce générale.</div>';
}

function enableNotifications() {
  if ('Notification' in window) {
    Notification.requestPermission().then(perm => {
      if (perm === 'granted') {
        alert("Notifications activées avec succès pour École Al-Carmelia!");
        new Notification("École Al-Carmelia", { body: "Les notifications sont activées!" });
      } else {
        alert("Permission refusée pour les notifications.");
      }
    });
  } else {
    alert("Les notifications ne sont pas supportées sur ce navigateur.");
  }
}
</script>
</body>
</html>
