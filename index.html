<!doctype html>
<html lang="fr" dir="ltr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>École Al-Carmelia</title>
<link rel="manifest" href="manifest.json">
<meta name="theme-color" content="#7b1238">

<!-- OneSignal Push Notifications SDK -->
<script src="https://cdn.onesignal.com/sdks/web/v16/OneSignalSDK.page.js" defer></script>
<script>
  window.OneSignalDeferred = window.OneSignalDeferred || [];
  OneSignalDeferred.push(async function(OneSignal) {
    try {
      await OneSignal.init({
        appId: "06bf4397-b256-467e-90af-175444f560af",
        allowLocalhostAsSecureOrigin: true,
      });
    } catch(e) {
      console.log("OneSignal init error:", e);
    }
  });
</script>

<style>
  :root {
    --burg: #7b1238;
    --navy: #12365f;
    --muted: #718096;
    --line: #e6e9ef;
  }
  * { box-sizing: border-box; }
  body {
    margin: 0;
    font-family: Inter, system-ui, -apple-system, sans-serif;
    background: #f4f6f9;
    display: flex;
    align-items: center;
    justify-content: center;
    min-height: 100vh;
    padding: 20px;
  }
  .card {
    background: #fff;
    padding: 35px 25px;
    border-radius: 24px;
    max-width: 420px;
    width: 100%;
    text-align: center;
    box-shadow: 0 12px 35px rgba(0,0,0,0.08);
    border: 1px solid #e6e9ef;
    display: flex;
    flex-direction: column;
    align-items: center;
  }
  
  /* --- LOGO L-MADRASE KBIR W WADIH --- */
  .logo-container {
    margin-bottom: 15px;
  }
  .logo-container img {
    width: 150px; /* Masahat l-Logo */
    height: 150px;
    object-fit: contain;
    filter: drop-shadow(0 6px 14px rgba(123, 18, 56, 0.18));
  }
  
  h1 {
    margin: 0 0 6px;
    color: var(--navy);
    font-size: 24px;
    font-weight: 800;
  }
  p {
    margin: 0 0 25px;
    color: var(--muted);
    font-size: 14px;
  }
  .btn {
    display: flex;
    align-items: center;
    justify-content: center;
    gap: 10px;
    width: 100%;
    padding: 14px;
    margin: 8px 0;
    border-radius: 12px;
    text-decoration: none;
    font-weight: 700;
    font-size: 15px;
    transition: all 0.2s ease;
    border: none;
    cursor: pointer;
  }
  .btn:hover {
    transform: translateY(-2px);
    box-shadow: 0 6px 18px rgba(0,0,0,0.1);
  }
  .parents { background: var(--burg); color: #fff; }
  .teacher { background: var(--navy); color: #fff; }
  .admin { background: #eef2f7; color: var(--navy); font-size: 13.5px; padding: 11px; margin-top: 10px; }

  /* --- BOUTTON L-TELECHARGEMENT MEN TAHET --- */
  .install-box {
    width: 100%;
    margin-top: 25px;
    padding-top: 20px;
    border-top: 2px dashed var(--line);
  }
  .btn-install {
    background: linear-gradient(135deg, #16825d, #0d5c41);
    color: #fff;
    font-size: 16px;
    box-shadow: 0 4px 16px rgba(22, 130, 93, 0.35);
  }
</style>
</head>
<body>

  <div class="card">
    <!-- LOGO KBIR W WADIH -->
    <div class="logo-container">
      <img src="icon-512.png" alt="École Al-Carmelia Logo">
    </div>

    <h1>École Al-Carmelia</h1>
    <p>Bienvenue sur le portail scolaire</p>
    
    <!-- NAVIGATION -->
    <a href="parents.html" class="btn parents">🎓 Espace Parents & Élèves</a>
    <a href="teacher.html" class="btn teacher">👩‍🏫 Espace Enseignants</a>
    <a href="admin.html" class="btn admin">⚙️ Administration</a>

    <!-- BOUTTON TÉLÉCHARGEMENT/INSTALLATION MEN TAHET -->
    <div class="install-box">
      <button id="installBtn" class="btn btn-install">
        📲 Télécharger / Installer l'Application
      </button>
    </div>
  </div>

  <script>
    // Register Service Worker
    if ('serviceWorker' in navigator) {
      window.addEventListener('load', () => {
        navigator.serviceWorker.register('./sw.js')
          .then(reg => console.log('Service Worker Registered'))
          .catch(err => console.error('Service Worker Error:', err));
      });
    }

    let deferredPrompt;
    const installBtn = document.getElementById('installBtn');

    window.addEventListener('beforeinstallprompt', (e) => {
      e.preventDefault();
      deferredPrompt = e;
    });

    // L-klick 3al Boutton
    installBtn.addEventListener('click', async () => {
      if (deferredPrompt) {
        deferredPrompt.prompt();
        const { outcome } = await deferredPrompt.userChoice;
        if (outcome === 'accepted') {
          console.log('App Installed Successfully');
        }
        deferredPrompt = null;
      } else if (/iPhone|iPad|iPod/i.test(navigator.userAgent)) {
        alert("Pour installer l'application sur iPhone / iPad :\n\n1. Cliquez sur le bouton 'Partager' (📤) en bas de Safari.\n2. Sélectionnez 'Sur l'écran d'accueil' (➕).");
      } else {
        alert("L'application est déjà installée sur votre appareil ou votre navigateur ne prend pas en charge le téléchargement direct.");
      }
    });
  </script>
</body>
</html>
