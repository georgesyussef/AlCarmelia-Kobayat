<!doctype html>
<html lang="fr" dir="ltr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>École Al-Carmelia · Portail Officiel</title>
<link rel="manifest" href="manifest.json">
<meta name="theme-color" content="#7b1238">
<link rel="apple-touch-icon" href="icon-192.png">
<style>
:root{--burg:#7b1238;--navy:#12365f;--gold:#d7ae45;--cream:#faf7ef;--ink:#172235;--muted:#718096;--line:#e6e9ef}
*{box-sizing:border-box}
body{margin:0;font-family:Inter,system-ui,-apple-system,sans-serif;background:var(--cream);color:var(--ink);display:flex;min-height:100vh;align-items:center;justify-content:center;padding:20px}
.main-card{background:#fff;border-radius:24px;border:1px solid var(--line);padding:35px 25px;width:min(440px,100%);text-align:center;box-shadow:0 15px 35px rgba(18,54,95,0.08)}
.logo-wrap{margin-bottom:15px}
.logo-wrap img{width:90px;height:90px;border-radius:20px;object-fit:cover;box-shadow:0 8px 20px rgba(123,18,56,0.15)}
h1{color:var(--navy);margin:0 0 6px;font-size:24px}
p{color:var(--muted);margin:0 0 25px;font-size:14px}
.portal-grid{display:flex;flex-direction:column;gap:12px}
.portal-btn{display:flex;align-items:center;justify-content:space-between;padding:16px 20px;border-radius:14px;text-decoration:none;font-weight:700;font-size:15px;transition:all .2s ease;border:1px solid var(--line);background:#fff;color:var(--navy)}
.portal-btn:hover{transform:translateY(-2px);box-shadow:0 6px 15px rgba(0,0,0,0.05);border-color:var(--burg)}
.portal-btn.admin{background:var(--navy);color:#fff;border-color:var(--navy)}
.portal-btn.teacher{background:var(--burg);color:#fff;border-color:var(--burg)}
.install-btn{margin-top:20px;background:var(--gold);color:#172235;border:0;width:100%;padding:12px;border-radius:12px;font-weight:700;cursor:pointer;display:none}
</style>
</head>
<body>

<div class="main-card">
  <div class="logo-wrap">
    <img src="icon-192.png" alt="Logo École Al-Carmelia">
  </div>
  <h1>École Al-Carmelia</h1>
  <p>Plateforme Scolaire Officielle</p>

  <div class="portal-grid">
    <a href="parents.html" class="portal-btn">
      <span>👨‍👩‍👧‍👦 Espace Parents & Élèves</span>
      <span>➔</span>
    </a>
    <a href="teacher.html" class="portal-btn teacher">
      <span>👩‍🏫 Espace Enseignants</span>
      <span>➔</span>
    </a>
    <a href="admin.html" class="portal-btn admin">
      <span>🔒 Administration</span>
      <span>➔</span>
    </a>
  </div>

  <button id="installAppBtn" class="install-btn" onclick="installPWA()">📲 Installer l'Application Mobile</button>
</div>

<script>
if ('serviceWorker' in navigator) {
  navigator.serviceWorker.register('sw.js');
}

let deferredPrompt;
window.addEventListener('beforeinstallprompt', (e) => {
  e.preventDefault();
  deferredPrompt = e;
  document.getElementById('installAppBtn').style.display = 'block';
});

function installPWA() {
  if (deferredPrompt) {
    deferredPrompt.prompt();
    deferredPrompt.userChoice.then(() => { deferredPrompt = null; });
  }
}
</script>
</body>
</html>
