<!doctype html>
<html lang="fr" dir="ltr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>École Al-Carmelia · Enseignants</title>
<link rel="manifest" href="manifest.json">
<meta name="theme-color" content="#7b1238">
<link rel="apple-touch-icon" href="icon-192.png">
<style>
:root{--burg:#7b1238;--navy:#12365f;--gold:#d7ae45;--cream:#faf7ef;--ink:#172235;--muted:#718096;--line:#e6e9ef;--white:#fff;--danger:#b42318;--green:#16825d}
*{box-sizing:border-box}
body{margin:0;font-family:Inter,system-ui,-apple-system,sans-serif;background:#f4f6f9;color:var(--ink)}
button,input,select,textarea{font:inherit}

.login-modal{position:fixed;inset:0;background:rgba(18,54,95,0.95);display:flex;align-items:center;justify-content:center;z-index:999;padding:15px}
.login-box{background:#fff;padding:35px 25px;border-radius:18px;width:min(400px,100%);text-align:center}
.login-box img{width:75px;height:75px;border-radius:12px;margin-bottom:12px;object-fit:cover}
.login-box h2{margin:0 0 8px;color:var(--navy)}
.login-box input{width:100%;padding:12px;border:1px solid #d8dde6;border-radius:10px;margin-bottom:12px;outline:none}

.pw-wrap{position:relative;display:flex;align-items:center;margin-bottom:12px}
.pw-wrap input{margin-bottom:0!important;padding-right:40px!important}
.pw-toggle{position:absolute;right:12px;background:none;border:none;cursor:pointer;font-size:18px;color:var(--muted)}

.container{max-width:1000px;margin:0 auto;padding:20px 15px}
.header{background:#fff;border-radius:16px;padding:16px 20px;border:1px solid var(--line);display:flex;justify-content:space-between;align-items:center;margin-bottom:20px}
.header-brand{display:flex;align-items:center;gap:12px}
.header-brand img{width:48px;height:48px;border-radius:10px;object-fit:cover}

.btn{border:0;border-radius:10px;padding:10px 16px;cursor:pointer;font-weight:650;display:inline-flex;align-items:center;gap:6px;font-size:14px}
.btn-block{width:100%}
.primary{background:var(--burg);color:#fff}
.secondary{background:#eef2f7;color:var(--navy)}
.danger{background:#fff0ef;color:var(--danger)}

.tabs{display:flex;gap:8px;margin-bottom:20px;overflow-x:auto}
.tab-btn{background:#fff;border:1px solid var(--line);padding:10px 18px;border-radius:10px;cursor:pointer;font-weight:600;color:var(--muted);white-space:nowrap}
.tab-btn.active{background:var(--burg);color:#fff;border-color:var(--burg)}

.card{background:#fff;border-radius:16px;border:1px solid var(--line);padding:20px;margin-bottom:15px}
.table{width:100%;border-collapse:collapse}
.table th,.table td{padding:12px 10px;border-bottom:1px solid var(--line);text-align:left}
.table th{font-size:12px;color:var(--muted)}
.table input{width:70px;padding:6px;border:1px solid #d8dde6;border-radius:6px;text-align:center}
</style>
<script src="https://www.gstatic.com/firebasejs/9.23.0/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/9.23.0/firebase-firestore-compat.js"></script>
</head>
<body>

<div id="loginModal" class="login-modal">
  <div class="login-box">
    <img src="icon-192.png" alt="Logo">
    <h2>Espace Enseignants</h2>
    <p style="color:var(--muted);font-size:13px;margin-bottom:20px">École Al-Carmelia</p>
    <input type="text" id="teacherIdInput" placeholder="ID Enseignant (Ex: T-01)">
    <div class="pw-wrap">
      <input type="password" id="teacherPinInput" placeholder="Code PIN">
      <button class="pw-toggle" type="button" onclick="togglePass('teacherPinInput', this)">👁️</button>
    </div>
    <button class="btn primary btn-block" onclick="loginTeacher()">Se Connecter</button>
  </div>
</div>

<div id="teacherContent" class="container" style="display:none">
  <header class="header">
    <div class="header-brand">
      <img src="icon-192.png" alt="Logo">
      <div>
        <h1 id="teacherNameDisplay" style="margin:0;font-size:18px;color:var(--navy)">Enseignant</h1>
        <p id="teacherSubjDisplay" style="margin:2px 0 0;color:var(--muted);font-size:13px">Matière</p>
      </div>
    </div>
    <button class="btn danger" style="padding:8px 14px;font-size:12px" onclick="logoutTeacher()">Déconnexion</button>
  </header>

  <nav class="tabs">
    <button class="tab-btn active" onclick="switchTab('t_agenda', this)">📖 Agenda / Devoirs</button>
    <button class="tab-btn" onclick="switchTab('t_grades', this)">📝 Saisie des Notes</button>
    <button class="tab-btn" onclick="switchTab('t_attendance', this)">📋 Absences</button>
  </nav>

  <div id="t_agenda" class="tab-content">
    <div class="card">
      <h3>Ajouter un Devoir / Agenda</h3>
      <div style="display:grid;grid-template-columns:1fr 1fr;gap:12px;margin-bottom:12px">
        <div><label style="font-size:12px;color:var(--muted)">Classe</label><select id="ag_class" style="width:100%;padding:10px;border-radius:8px;border:1px solid #d8dde6"></select></div>
        <div><label style="font-size:12px;color:var(--muted)">Pour le (Date)</label><input type="date" id="ag_date" style="width:100%;padding:10px;border-radius:8px;border:1px solid #d8dde6"></div>
      </div>
      <div style="margin-bottom:12px">
        <label style="font-size:12px;color:var(--muted)">Titre du cours / Chapitre</label>
        <input type="text" id="ag_title" style="width:100%;padding:10px;border-radius:8px;border:1px solid #d8dde6" placeholder="Ex: Ch 3 - Exercices Page 42">
      </div>
      <div style="margin-bottom:15px">
        <label style="font-size:12px;color:var(--muted)">Détails du Devoir</label>
        <textarea id="ag_body" rows="3" style="width:100%;padding:10px;border-radius:8px;border:1px solid #d8dde6" placeholder="Consignes particulières..."></textarea>
      </div>
      <button class="btn primary" onclick="saveAgenda()">Publier l'Agenda</button>
    </div>

    <div class="card">
      <h3>Devoirs Récents Publiés</h3>
      <div id="teacherAgendaList"></div>
    </div>
  </div>

  <div id="t_grades" class="tab-content" style="display:none">
    <div class="card">
      <div style="display:flex;gap:10px;margin-bottom:15px;align-items:center">
        <select id="gr_class" onchange="renderGradesTable()" style="padding:10px;border-radius:8px;border:1px solid #d8dde6"></select>
        <button class="btn primary" onclick="saveGrades()">💾 Enregistrer les Notes</button>
      </div>
      <div style="overflow-x:auto">
        <table class="table">
          <thead><tr><th>Élève</th><th>Note / 20</th><th>Remarque</th></tr></thead>
          <tbody id="gradesBody"></tbody>
        </table>
      </div>
    </div>
  </div>

  <div id="t_attendance" class="tab-content" style="display:none">
    <div class="card">
      <div style="display:flex;gap:10px;margin-bottom:15px;align-items:center">
        <select id="att_class" onchange="renderAttendanceTable()" style="padding:10px;border-radius:8px;border:1px solid #d8dde6"></select>
        <input type="date" id="att_date" onchange="renderAttendanceTable()" style="padding:10px;border-radius:8px;border:1px solid #d8dde6">
        <button class="btn primary" onclick="saveAttendance()">💾 Valider Absences</button>
      </div>
      <div style="overflow-x:auto">
        <table class="table">
          <thead><tr><th>Élève</th><th>Statut</th></tr></thead>
          <tbody id="attendanceBody"></tbody>
        </table>
      </div>
    </div>
  </div>
</div>

<script>
if ('serviceWorker' in navigator) {
  navigator.serviceWorker.register('sw.js');
}

const firebaseConfig = {
  apiKey: "AIzaSyDJRfis99yy8m9Z7pIHkw3U2i0jUqLXBec",
  authDomain: "carmelia-school.firebaseapp.com",
  projectId: "carmelia-school",
  storageBucket: "carmelia-school.firebasestorage.app",
  messagingSenderId: "710304409299",
  appId: "1:710304409299:web:44c4c109d432a6e3ba1626"
};
firebase.initializeApp(firebaseConfig);
const firestore = firebase.firestore();

let db = { students:[], classes:[], agenda:[], grades:{}, attendance:{} };
let currentTeacher = null;

firestore.collection("school_data").doc("main").onSnapshot((doc) => {
  if (doc.exists) {
    db = doc.data();
    if(currentTeacher) renderTeacherData();
  }
});

function togglePass(id, btn){
  const inp = document.getElementById(id);
  inp.type = inp.type==='password'?'text':'password';
  btn.textContent = inp.type==='password'?'👁️':'🙈';
}

function esc(s){return String(s??'').replace(/[&<>"']/g,m=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[m]))}

function loginTeacher() {
  const tid = teacherIdInput.value.trim().toUpperCase();
  const pin = teacherPinInput.value.trim();
  const t = (db.teachers || []).find(x => x.id.toUpperCase() === tid && (x.pin || '1234') === pin);

  if (t) {
    currentTeacher = t;
    sessionStorage.setItem('teacher_id', t.id);
    document.getElementById('loginModal').style.display = 'none';
    document.getElementById('teacherContent').style.display = 'block';
    renderTeacherData();
  } else {
    alert("ID ou PIN incorrect.");
  }
}

function logoutTeacher() { sessionStorage.removeItem('teacher_id'); location.reload(); }

function switchTab(tabId, btn) {
  document.querySelectorAll('.tab-content').forEach(c => c.style.display = 'none');
  document.querySelectorAll('.tab-btn').forEach(b => b.classList.remove('active'));
  document.getElementById(tabId).style.display = 'block';
  btn.classList.add('active');
}

function renderTeacherData() {
  teacherNameDisplay.textContent = currentTeacher.name;
  teacherSubjDisplay.textContent = "Professeur de " + (currentTeacher.subject || "Général");

  const opts = (db.classes || []).map(c => `<option value="${esc(c.code)}">${esc(c.code)} - ${esc(c.name)}</option>`).join('');
  ag_class.innerHTML = opts;
  gr_class.innerHTML = opts;
  att_class.innerHTML = opts;
  
  if(!ag_date.value) ag_date.value = new Date().toISOString().split('T')[0];
  if(!att_date.value) att_date.value = new Date().toISOString().split('T')[0];

  renderTeacherAgenda();
  renderGradesTable();
  renderAttendanceTable();
}

function saveAgenda() {
  if(!db.agenda) db.agenda = [];
  const item = {
    id: Date.now().toString(),
    class: ag_class.value,
    date: ag_date.value,
    subject: currentTeacher.subject || 'Général',
    title: ag_title.value.trim(),
    body: ag_body.value.trim(),
    teacher: currentTeacher.name
  };
  if(!item.title) return alert("Entrez un titre.");
  db.agenda.push(item);
  firestore.collection("school_data").doc("main").set(db).then(() => {
    alert("Agenda publié!");
    ag_title.value = ""; ag_body.value = "";
    renderTeacherAgenda();
  });
}

function renderTeacherAgenda() {
  const list = (db.agenda || []).filter(a => a.teacher === currentTeacher.name);
  teacherAgendaList.innerHTML = list.map(a => `
    <div style="border-bottom:1px solid var(--line);padding:10px 0">
      <strong>[${esc(a.class)}] ${esc(a.title)}</strong> <small style="color:var(--muted)">pour le ${esc(a.date)}</small>
      <p style="margin:4px 0 0;font-size:13px">${esc(a.body)}</p>
    </div>
  `).join('') || '<div style="color:var(--muted);padding:10px">Aucun devoir publié.</div>';
}

function renderGradesTable() {
  const cls = gr_class.value;
  const stList = (db.students || []).filter(s => s.class === cls);
  if(!db.grades) db.grades = {};

  gradesBody.innerHTML = stList.map(s => {
    const key = `${s.id}_${currentTeacher.subject || 'Gen'}`;
    const g = db.grades[key] || { note: '', rem: '' };
    return `
      <tr>
        <td><strong>${esc(s.name)}</strong> <small>(${esc(s.id)})</small></td>
        <td><input type="text" id="g_note_${esc(s.id)}" value="${esc(g.note)}"></td>
        <td><input type="text" id="g_rem_${esc(s.id)}" style="width:180px" value="${esc(g.rem)}" placeholder="Remarque..."></td>
      </tr>
    `;
  }).join('') || '<tr><td colspan="3" style="text-align:center;color:var(--muted)">Aucun élève dans cette classe.</td></tr>';
}

function saveGrades() {
  const cls = gr_class.value;
  const stList = (db.students || []).filter(s => s.class === cls);
  if(!db.grades) db.grades = {};

  stList.forEach(s => {
    const note = document.getElementById(`g_note_${s.id}`)?.value.trim() || '';
    const rem = document.getElementById(`g_rem_${s.id}`)?.value.trim() || '';
    const key = `${s.id}_${currentTeacher.subject || 'Gen'}`;
    db.grades[key] = { note, rem, subject: currentTeacher.subject || 'Général' };
  });

  firestore.collection("school_data").doc("main").set(db).then(() => alert("Notes enregistrées!"));
}

function renderAttendanceTable() {
  const cls = att_class.value;
  const dt = att_date.value;
  const stList = (db.students || []).filter(s => s.class === cls);
  if(!db.attendance) db.attendance = {};

  attendanceBody.innerHTML = stList.map(s => {
    const key = `${dt}_${s.id}`;
    const st = db.attendance[key] || 'Présent';
    return `
      <tr>
        <td><strong>${esc(s.name)}</strong></td>
        <td>
          <select id="att_val_${esc(s.id)}" style="padding:6px;border-radius:6px;border:1px solid #d8dde6">
            <option value="Présent" ${st==='Présent'?'selected':''}>✅ Présent</option>
            <option value="Absent" ${st==='Absent'?'selected':''}>❌ Absent</option>
            <option value="Retard" ${st==='Retard'?'selected':''}>⚠️ Retard</option>
          </select>
        </td>
      </tr>
    `;
  }).join('') || '<tr><td colspan="2" style="text-align:center;color:var(--muted)">Aucun élève.</td></tr>';
}

function saveAttendance() {
  const cls = att_class.value;
  const dt = att_date.value;
  const stList = (db.students || []).filter(s => s.class === cls);
  if(!db.attendance) db.attendance = {};

  stList.forEach(s => {
    const val = document.getElementById(`att_val_${s.id}`)?.value || 'Présent';
    const key = `${dt}_${s.id}`;
    db.attendance[key] = val;
  });

  firestore.collection("school_data").doc("main").set(db).then(() => alert("Absences enregistrées!"));
}
</script>
</body>
</html>
